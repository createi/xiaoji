version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xiaoji-api-prod
    ports:
      - "7001:7001"
    env_file:
      - apps/api/.env.production
    depends_on:
      - mysql
      - redis
    restart: always
    networks:
      - xiaoji-net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: xiaoji-admin-prod
    ports:
      - "80:80"
    restart: always
    networks:
      - xiaoji-net

  mysql:
    image: mysql:8.0
    container_name: xiaoji-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: xiaoji_prod
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    volumes:
      - mysql_prod_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    networks:
      - xiaoji-net

  redis:
    image: redis:7-alpine
    container_name: xiaoji-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis_prod_data:/data
    restart: always
    networks:
      - xiaoji-net

  nginx:
    image: nginx:alpine
    container_name: xiaoji-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - api
      - admin
    restart: always
    networks:
      - xiaoji-net

volumes:
  mysql_prod_data:
  redis_prod_data:

networks:
  xiaoji-net:
    driver: bridge
